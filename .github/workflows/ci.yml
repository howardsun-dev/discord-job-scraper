name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobscraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscraper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      RUN_DB_TESTS: "true"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: jobscraper
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_ENV: production
          DB_RUN_MIGRATIONS: "true"
      - run: npm run build
